version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_TAG:-latest}
    container_name: hermes-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - |
          bash -c '
            exec 3<>/dev/tcp/localhost/6333
            printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3
            grep -q "200 OK" <&3
          '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hermes-net
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:${PREFECT_TAG:-3-latest}
    container_name: hermes-prefect-server
    command:
      - prefect
      - server
      - start
      - --host
      - 0.0.0.0
      - --port
      - "4200"
    ports:
      - "${PREFECT_SERVER_PORT:-4200}:4200"
    volumes:
      - prefect-db:/root/.prefect
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_SERVER_API_PORT=4200
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - qdrant
    networks:
      - hermes-net
    restart: unless-stopped

  prefect-worker:
    image: prefecthq/prefect:${PREFECT_TAG:-3-latest}
    container_name: hermes-prefect-worker
    command:
      - prefect
      - worker
      - start
      - --pool
      - ${PREFECT_WORK_POOL:-hermes-pool}
      - --type
      - process
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://prefect-server:4200/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prefect-server:
        condition: service_healthy
    networks:
      - hermes-net
    restart: unless-stopped

  hermes-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HERMES_GIT_SHA=${HERMES_GIT_SHA:-}
    image: hermes-gateway:${HERMES_TAG:-latest}
    container_name: hermes-gateway
    ports:
      - "${HERMES_API_PORT:-8642}:8642"
      - "${HERMES_WEBHOOK_PORT:-8648}:8648"
    volumes:
      - hermes-state:/opt/data
    environment:
      - HERMES_HOME=/opt/data
      - QDRANT_URL=http://qdrant:6333
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8642/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - hermes-net
    restart: unless-stopped

volumes:
  qdrant-data:
    name: hermes-qdrant-data
  prefect-db:
    name: hermes-prefect-db
  hermes-state:
    name: hermes-state

networks:
  hermes-net:
    name: hermes-net
    driver: bridge
