[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmad-evolve-command"
version = "0.1.0"
description = "Offline command-body tuner for BMAD — GEPA optimization of /bmad:dev-story"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "dspy>=2.6",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
bmad-evolve-command = "evolve_command.cli:main"
