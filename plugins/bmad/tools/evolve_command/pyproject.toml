[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmad-evolve-command"
version = "0.1.0"
description = "Offline command-body tuner for BMAD — GEPA optimization of /bmad:dev-story"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "dspy>=2.6",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "hermes-bmad-self-evolution",
    "hermes-bmad-skillopt",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
bmad-evolve-command = "evolve_command.cli:main"

[tool.uv.sources]
hermes-bmad-self-evolution = { path = "../../../../../hermes-self-evolution", editable = true }
hermes-bmad-skillopt       = { path = "../../../../../hermes-skillopt", editable = true }
# Prod (CI-only override):
# hermes-bmad-self-evolution = { git = "https://github.com/marozau/hermes-agent-self-evolution.git", rev = "<SHA>" }
# hermes-bmad-skillopt       = { git = "https://github.com/marozau/hermes-skillopt.git", rev = "<SHA>" }
